services:
  - type: web
    name: abror-harness
    runtime: node
    plan: free
    buildCommand: npm install && cd web && npm install && cd .. && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
